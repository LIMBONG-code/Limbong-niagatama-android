name: Build APK LIMBONG NIAGATAMA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil berkas repository
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek Android
        run: unzip -q LIMBONG-NIAGATAMA-Android-Proyek.zip -d .

      - name: Bangun APK
        run: gradle -p LIMBONG-NIAGATAMA-Android assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: LIMBONG-NIAGATAMA-APK
          path: LIMBONG-NIAGATAMA-Android/app/build/outputs/apk/debug/app-debug.apk
